claro_security_login:
    path: /login
    options: { expose: true }

claro_security_login_check_oauth2:
    path: /login/check/oauth2
    options: { expose: true }

claro_security_logout:
    path: /logout
    options: { expose: true }

# API
claro_authentication:
    resource: "@ClarolineAuthenticationBundle/Controller/"
    type: attribute
    options:
        expose: true
