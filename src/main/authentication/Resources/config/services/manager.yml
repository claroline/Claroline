            - '@Claroline\CoreBundle\Manager\Template\TemplateManager'
            - '@Claroline\CoreBundle\Manager\UserManager'

    Claroline\AuthenticationBundle\Manager\AuthenticationManager:
        arguments:
            - '@Claroline\AppBundle\Persistence\ObjectManager'
